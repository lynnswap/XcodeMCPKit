name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing draft release tag to publish after checks succeed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Prepare Draft Release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
      prerelease: ${{ steps.draft.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate and pin the approved draft
        id: draft
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py prepare --version "$RELEASE_VERSION" --source-sha "$GITHUB_SHA"

  package-checks:
    name: Package Checks
    needs: verify-release
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      concurrency_group: release-package-checks-${{ inputs.version }}

  process-tests:
    name: Process Tests (macOS, ${{ matrix.suite }})
    needs: package-checks
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite:
          - XcodeMCPProcessRuntimeTests
          - ProxyStdioAdapterTests
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Select latest Xcode
        id: toolchain
        run: |
          set -euo pipefail
          xcode_path="$(
            ruby -e 'candidates = Dir["/Applications/Xcode*.app"].filter_map { |path| version = File.basename(path)[/\AXcode[_-](\d+(?:\.\d+)*)\.app\z/, 1]; version ? [version.split(".").map(&:to_i), path] : nil }; abort "No versioned Xcode apps found" if candidates.empty?; puts candidates.max_by(&:first).last'
          )"
          sudo xcode-select -s "${xcode_path}/Contents/Developer"
          xcodebuild -version
          swift --version
          cache_id="$(xcodebuild -version | tr '\n ' '--' | tr -cd '[:alnum:]._-')"
          echo "cache-id=${cache_id}" >> "$GITHUB_OUTPUT"

      - name: Restore built package tests
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-build-v2-debug-strict-minimal-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-id }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Run process tests
        env:
          XCODE_MCP_RUN_PROCESS_TESTS: "1"
        run: |
          ./scripts/ci-test-watchdog.sh swift test \
            --skip-build \
            --no-parallel \
            --filter "${{ matrix.suite }}" \
            -Xswiftc -strict-concurrency=minimal

  build-release:
    name: Build Release
    needs: process-tests
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      archive_sha256: ${{ steps.release_digests.outputs.archive_sha256 }}
      artifact-id: ${{ steps.release_assets.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          xcode_path="$(
            ruby -e 'candidates = Dir["/Applications/Xcode*.app"].filter_map { |path| version = File.basename(path)[/\AXcode[_-](\d+(?:\.\d+)*)\.app\z/, 1]; version ? [version.split(".").map(&:to_i), path] : nil }; abort "No versioned Xcode apps found" if candidates.empty?; puts candidates.max_by(&:first).last'
          )"
          sudo xcode-select -s "${xcode_path}/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Build release binaries
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: scripts/build-release.sh --version "${RELEASE_VERSION}" --dist-root dist

      - name: Package release assets
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          scripts/package-release.sh \
            --version "${RELEASE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dist-root dist \
            --output-dir release

      - name: Verify release assets
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          scripts/verify-release-assets.sh \
            --version "${RELEASE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --release-dir release

      - name: Record trusted release digest
        id: release_digests
        run: |
          set -euo pipefail
          archive_sha256="$(shasum -a 256 release/xcode-mcp-proxy-darwin-arm64.tar.gz | awk '{ print $1 }')"
          echo "archive_sha256=${archive_sha256}" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        id: release_assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/xcode-mcp-proxy-darwin-arm64.tar.gz
            release/SHA256SUMS.txt
            release/install.sh
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [verify-release, build-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download this run's release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-release.outputs.artifact-id }}
          path: release
          digest-mismatch: error

      - name: Verify assets and publish the approved draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_ID: ${{ needs.verify-release.outputs.release-id }}
          RELEASE_PRERELEASE: ${{ needs.verify-release.outputs.prerelease }}
          ARCHIVE_SHA256: ${{ needs.build-release.outputs.archive_sha256 }}
        run: |
          python3 scripts/release.py publish \
            --version "$RELEASE_VERSION" \
            --source-sha "$GITHUB_SHA" \
            --release-id "$RELEASE_ID" \
            --prerelease "$RELEASE_PRERELEASE" \
            --directory release \
            --archive-sha256 "$ARCHIVE_SHA256"
