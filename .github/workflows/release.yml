name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to create
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build Release
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}

      - name: Verify release input
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" != "branch" || "${GITHUB_REF_NAME}" != "${RELEASE_BRANCH}" ]]; then
            echo "Release workflow must be dispatched from ${RELEASE_BRANCH}." >&2
            echo "Expected branch: ${RELEASE_BRANCH}" >&2
            echo "Actual ref: ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          remote_head="$(git ls-remote origin "refs/heads/${RELEASE_BRANCH}" | awk '{ print $1 }')"
          if [[ -z "${remote_head}" ]]; then
            echo "Could not resolve remote branch: ${RELEASE_BRANCH}" >&2
            exit 1
          fi
          if [[ "${remote_head}" != "${GITHUB_SHA}" ]]; then
            echo "Release workflow must run against the current ${RELEASE_BRANCH} head." >&2
            echo "Remote head: ${remote_head}" >&2
            echo "Workflow SHA: ${GITHUB_SHA}" >&2
            exit 1
          fi
          remote_tag_target() {
            git ls-remote --tags origin "refs/tags/${RELEASE_VERSION}" "refs/tags/${RELEASE_VERSION}^{}" |
              awk '$2 ~ /\^\{\}$/ { peeled = $1 } $2 !~ /\^\{\}$/ { direct = $1 } END { if (peeled != "") print peeled; else if (direct != "") print direct }'
          }
          tag_target="$(remote_tag_target)"
          if [[ -n "${tag_target}" && "${tag_target}" != "${GITHUB_SHA}" ]]; then
            echo "Release tag already exists for a different commit: ${RELEASE_VERSION}" >&2
            echo "Tag target: ${tag_target}" >&2
            echo "Workflow SHA: ${GITHUB_SHA}" >&2
            exit 1
          fi
          if release_is_draft="$(gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "${release_is_draft}" != "true" ]]; then
              echo "GitHub Release already exists and is not a draft: ${RELEASE_VERSION}" >&2
              exit 1
            fi
            echo "Existing draft release will be repaired: ${RELEASE_VERSION}"
          fi

      - name: Setup Swift 6.3
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.3"

      - name: Run package checks
        run: scripts/check.sh

      - name: Build release binaries
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: scripts/build-release.sh --version "${RELEASE_VERSION}" --dist-root dist

      - name: Package release assets
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          scripts/package-release.sh \
            --version "${RELEASE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dist-root dist \
            --output-dir release

      - name: Verify release assets
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          expected_assets=(
            "xcode-mcp-proxy-darwin-arm64.tar.gz"
            "SHA256SUMS.txt"
            "install.sh"
          )

          for asset in "${expected_assets[@]}"; do
            if [[ ! -f "release/${asset}" ]]; then
              echo "Expected release asset was not created: ${asset}" >&2
              exit 1
            fi
          done

          (
            cd release
            shasum -a 256 -c SHA256SUMS.txt
          )

          sh -n release/install.sh
          scripts/render-install-script.sh \
            --version "${RELEASE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --output release/install.expected.sh
          if ! cmp -s release/install.expected.sh release/install.sh; then
            echo "install.sh does not match the generated installer for ${RELEASE_VERSION}." >&2
            diff -u release/install.expected.sh release/install.sh || true
            exit 1
          fi
          rm release/install.expected.sh

          expected_entries="$(printf '%s\n' \
            "bin/" \
            "bin/xcode-mcp-proxy" \
            "bin/xcode-mcp-proxy-server")"
          actual_entries="$(tar -tzf release/xcode-mcp-proxy-darwin-arm64.tar.gz | sort)"
          if [[ "${actual_entries}" != "${expected_entries}" ]]; then
            echo "Release archive contents are not expected." >&2
            printf 'Expected:\n%s\n' "${expected_entries}" >&2
            printf 'Actual:\n%s\n' "${actual_entries}" >&2
            exit 1
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            release/xcode-mcp-proxy-darwin-arm64.tar.gz
            release/SHA256SUMS.txt
            release/install.sh
          if-no-files-found: error

  create-draft-release:
    name: Create Draft Release
    needs: build-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release

      - name: Verify release target
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" != "branch" || "${GITHUB_REF_NAME}" != "${RELEASE_BRANCH}" ]]; then
            echo "Release workflow must be dispatched from ${RELEASE_BRANCH}." >&2
            echo "Expected branch: ${RELEASE_BRANCH}" >&2
            echo "Actual ref: ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          remote_head="$(git ls-remote origin "refs/heads/${RELEASE_BRANCH}" | awk '{ print $1 }')"
          if [[ -z "${remote_head}" ]]; then
            echo "Could not resolve remote branch: ${RELEASE_BRANCH}" >&2
            exit 1
          fi
          if [[ "${remote_head}" != "${GITHUB_SHA}" ]]; then
            echo "Release workflow must run against the current ${RELEASE_BRANCH} head." >&2
            echo "Remote head: ${remote_head}" >&2
            echo "Workflow SHA: ${GITHUB_SHA}" >&2
            exit 1
          fi
          remote_tag_target() {
            git ls-remote --tags origin "refs/tags/${RELEASE_VERSION}" "refs/tags/${RELEASE_VERSION}^{}" |
              awk '$2 ~ /\^\{\}$/ { peeled = $1 } $2 !~ /\^\{\}$/ { direct = $1 } END { if (peeled != "") print peeled; else if (direct != "") print direct }'
          }
          tag_target="$(remote_tag_target)"
          if [[ -n "${tag_target}" && "${tag_target}" != "${GITHUB_SHA}" ]]; then
            echo "Release tag already exists for a different commit: ${RELEASE_VERSION}" >&2
            echo "Tag target: ${tag_target}" >&2
            echo "Workflow SHA: ${GITHUB_SHA}" >&2
            exit 1
          fi
          if release_is_draft="$(gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "${release_is_draft}" != "true" ]]; then
              echo "GitHub Release already exists and is not a draft: ${RELEASE_VERSION}" >&2
              exit 1
            fi
            echo "Existing draft release will be repaired: ${RELEASE_VERSION}"
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          remote_tag_target() {
            git ls-remote --tags origin "refs/tags/${RELEASE_VERSION}" "refs/tags/${RELEASE_VERSION}^{}" |
              awk '$2 ~ /\^\{\}$/ { peeled = $1 } $2 !~ /\^\{\}$/ { direct = $1 } END { if (peeled != "") print peeled; else if (direct != "") print direct }'
          }
          is_expected_asset() {
            case "$1" in
              xcode-mcp-proxy-darwin-arm64.tar.gz|SHA256SUMS.txt|install.sh)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          tag_target="$(remote_tag_target)"
          if [[ -n "${tag_target}" && "${tag_target}" != "${GITHUB_SHA}" ]]; then
            echo "Release tag already exists for a different commit: ${RELEASE_VERSION}" >&2
            echo "Tag target: ${tag_target}" >&2
            echo "Workflow SHA: ${GITHUB_SHA}" >&2
            exit 1
          fi

          if release_is_draft="$(gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "${release_is_draft}" != "true" ]]; then
              echo "GitHub Release already exists and is not a draft: ${RELEASE_VERSION}" >&2
              exit 1
            fi
            if [[ -z "${tag_target}" ]]; then
              echo "Draft release exists but the release tag is missing: ${RELEASE_VERSION}" >&2
              exit 1
            fi

            while IFS= read -r asset_name; do
              [[ -n "${asset_name}" ]] || continue
              if ! is_expected_asset "${asset_name}"; then
                gh release delete-asset "${RELEASE_VERSION}" "${asset_name}" --repo "${GITHUB_REPOSITORY}" --yes
              fi
            done < <(gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')

            gh release upload "${RELEASE_VERSION}" \
              release/xcode-mcp-proxy-darwin-arm64.tar.gz \
              release/SHA256SUMS.txt \
              release/install.sh \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber

            echo "Repaired draft release ${RELEASE_VERSION}."
          else
            gh release create "${RELEASE_VERSION}" \
              release/xcode-mcp-proxy-darwin-arm64.tar.gz \
              release/SHA256SUMS.txt \
              release/install.sh \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --generate-notes \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_VERSION}"

            echo "Created draft release ${RELEASE_VERSION}."
          fi
          echo "Edit the release notes, then publish the draft manually."
