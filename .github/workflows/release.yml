name: Release Verification

# Release assets are built and uploaded by scripts/publish-local-release.sh.
# The local script pushes the tag, creates the draft release, and explicitly
# dispatches this workflow for that tag ref. Tag pushes alone do not publish.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-verification-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  package-tests:
    name: Package Tests
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify release ref
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "${RELEASE_VERSION}" ]]; then
            echo "Release verification must be dispatched against the release tag ref." >&2
            echo "Expected tag: ${RELEASE_VERSION}" >&2
            echo "Actual ref: ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Setup Swift 6.2
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.2"

      - name: Run package checks
        run: scripts/check.sh

  publish-release:
    name: Publish Verified Release
    needs: package-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify release ref
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "${RELEASE_VERSION}" ]]; then
            echo "Release publishing must be dispatched against the release tag ref." >&2
            echo "Expected tag: ${RELEASE_VERSION}" >&2
            echo "Actual ref: ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Publish verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          tag_name="$(gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --json tagName --jq '.tagName')"
          if [[ "${tag_name}" != "${RELEASE_VERSION}" ]]; then
            echo "Release tag mismatch." >&2
            echo "Expected tag: ${RELEASE_VERSION}" >&2
            echo "Actual tag:   ${tag_name}" >&2
            exit 1
          fi

          expected_assets=(
            "xcode-mcp-proxy-darwin-arm64.tar.gz"
            "SHA256SUMS.txt"
            "install.sh"
          )

          mapfile -t asset_names < <(
            gh release view "${RELEASE_VERSION}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[].name'
          )

          is_expected_asset() {
            local candidate="$1"
            local expected
            for expected in "${expected_assets[@]}"; do
              if [[ "${candidate}" == "${expected}" ]]; then
                return 0
              fi
            done
            return 1
          }

          for expected in "${expected_assets[@]}"; do
            if ! printf '%s\n' "${asset_names[@]}" | grep -Fxq "${expected}"; then
              echo "Expected uploaded release asset was not found: ${expected}" >&2
              exit 1
            fi
          done

          for asset in "${asset_names[@]}"; do
            if ! is_expected_asset "${asset}"; then
              echo "Unexpected release asset found: ${asset}" >&2
              exit 1
            fi
          done

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT

          gh release download "${RELEASE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "xcode-mcp-proxy-darwin-arm64.tar.gz" \
            --dir "${tmp_dir}"
          gh release download "${RELEASE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "SHA256SUMS.txt" \
            --dir "${tmp_dir}"
          gh release download "${RELEASE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "install.sh" \
            --dir "${tmp_dir}"

          expected_checksum_files=(
            "xcode-mcp-proxy-darwin-arm64.tar.gz"
            "install.sh"
          )

          mapfile -t checksum_lines < <(grep -v '^[[:space:]]*$' "${tmp_dir}/SHA256SUMS.txt")
          if [[ "${#checksum_lines[@]}" -ne "${#expected_checksum_files[@]}" ]]; then
            echo "SHA256SUMS.txt must contain exactly ${#expected_checksum_files[@]} checksum entries." >&2
            exit 1
          fi

          for expected in "${expected_checksum_files[@]}"; do
            if ! awk -v name="${expected}" '$1 ~ /^[0-9a-f]{64}$/ && $2 == name { found = 1 } END { exit found ? 0 : 1 }' "${tmp_dir}/SHA256SUMS.txt"; then
              echo "SHA256SUMS.txt is missing the expected checksum entry for ${expected}." >&2
              exit 1
            fi
          done

          (
            cd "${tmp_dir}"
            shasum -a 256 -c SHA256SUMS.txt
          )

          sh -n "${tmp_dir}/install.sh"
          scripts/render-install-script.sh \
            --version "${RELEASE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --output "${tmp_dir}/install.expected.sh"
          if ! cmp -s "${tmp_dir}/install.expected.sh" "${tmp_dir}/install.sh"; then
            echo "install.sh does not match the generated installer for ${RELEASE_VERSION}." >&2
            diff -u "${tmp_dir}/install.expected.sh" "${tmp_dir}/install.sh" || true
            exit 1
          fi

          is_draft="$(gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')"
          is_prerelease="$(gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --json isPrerelease --jq '.isPrerelease')"
          if [[ "${is_draft}" != "true" ]]; then
            if [[ "${is_prerelease}" == "false" ]]; then
              echo "Release ${RELEASE_VERSION} is already published."
              exit 0
            fi
            echo "Release ${RELEASE_VERSION} is already public but marked as a prerelease." >&2
            exit 1
          fi

          gh release edit "${RELEASE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --prerelease=false
