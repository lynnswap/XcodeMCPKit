name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_name }}
  BINARY_ASSET: xcode-mcpkit-${{ github.ref_name }}-macOS-arm64.zip

jobs:
  prepare:
    name: Check release tag
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 -c 'import sys; from scripts.package_release import is_prerelease; print("prerelease=" + str(is_prerelease(sys.argv[1])).lower())' "$VERSION" >> "$GITHUB_OUTPUT"
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  tests:
    name: Test tagged source
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.prepare.outputs.commit }}
      run_process_tests: true
      concurrency_group: release-tests-${{ github.ref }}

  package:
    name: Build release assets
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.package.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the CLI and native host
        run: |
          xcodebuild -version
          scripts/build-release.sh --version "$VERSION" --dist-root "$RUNNER_TEMP/dist"
          mkdir -p xcode-mcpkit/bin release
          mv "$RUNNER_TEMP/dist/arm64/bin" xcode-mcpkit/libexec
          ln -s ../libexec/xcode-mcp-server xcode-mcpkit/bin/xcode-mcp-server
          ditto -c -k --keepParent xcode-mcpkit unsigned.zip
      - name: Prepare source and Formula
        env:
          TAG_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$VERSION.tar.gz" \
            --output "$RUNNER_TEMP/source.tar.gz"
          python3 scripts/package_release.py create --source-root . --commit "$TAG_COMMIT" \
            --version "$VERSION" --repo "$GITHUB_REPOSITORY" --output-dir release \
            --source-archive "$RUNNER_TEMP/source.tar.gz"
          python3 scripts/package_release.py verify --version "$VERSION" --release-dir release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: package
        with:
          name: release-inputs-${{ github.run_attempt }}
          path: |
            unsigned.zip
            release/
          if-no-files-found: error

  sign:
    name: Sign and notarize release archive
    needs: [tests, package]
    runs-on: xcode-27
    timeout-minutes: 40
    environment: release-signing
    outputs:
      artifact_id: ${{ steps.signed.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          digest-mismatch: error
      - name: Sign staged code and submit the archive to Apple
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_PRIVATE_KEY: ${{ secrets.NOTARY_API_PRIVATE_KEY }}
          NOTARY_API_KEY_ID: ${{ vars.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ vars.NOTARY_API_ISSUER_ID }}
        run: |
          ditto -x -k unsigned.zip "$RUNNER_TEMP"
          scripts/sign-release.sh sign "$RUNNER_TEMP/xcode-mcpkit" "$PWD/$BINARY_ASSET"
          shasum -a 256 "$BINARY_ASSET" > macOS-arm64-SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: signed
        with:
          name: signed-macos-arm64-${{ github.run_attempt }}
          path: |
            ${{ env.BINARY_ASSET }}
            macOS-arm64-SHA256SUMS.txt
          if-no-files-found: error

  verify:
    name: Verify the signed release archive
    needs: sign
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact_id }}
          digest-mismatch: error
      - name: Verify the extracted distribution and exercise MCP
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          shasum -a 256 -c macOS-arm64-SHA256SUMS.txt
          ditto -x -k "$BINARY_ASSET" "$RUNNER_TEMP"
          scripts/sign-release.sh verify "$RUNNER_TEMP/xcode-mcpkit"
          python3 scripts/smoke-homebrew.py --prefix "$RUNNER_TEMP/xcode-mcpkit" \
            --version "$VERSION" --fixture Fixtures/ProxyToolVerifierFixture

  publish:
    name: Publish GitHub Release
    needs: [prepare, package, sign, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact_id }}
          digest-mismatch: error
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          sha256sum --check macOS-arm64-SHA256SUMS.txt
          (cd release && sha256sum --check SHA256SUMS.txt)
          python3 scripts/release.py publish-tagged --repo "$GITHUB_REPOSITORY" \
            --version "$VERSION" --target "$TAG_COMMIT" --run-id "$GITHUB_RUN_ID" \
            "$BINARY_ASSET" macOS-arm64-SHA256SUMS.txt release/*

  homebrew:
    name: Request Homebrew update after publication
    needs: [prepare, package, publish]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    environment: release-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          digest-mismatch: error
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: tap-token
        with:
          client-id: ${{ vars.TAP_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_DISPATCH_APP_PRIVATE_KEY }}
          owner: lynnswap
          repositories: homebrew-tap
          permission-actions: write
      - name: Dispatch the tap workflow
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAG_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          python3 scripts/release.py dispatch-tap --source-repository "$GITHUB_REPOSITORY" \
            --version "$VERSION" --target "$TAG_COMMIT" --release-dir release
