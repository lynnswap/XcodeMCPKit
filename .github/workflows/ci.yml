name: CI

on:
  workflow_call:
    inputs:
      source_sha:
        description: Approved source commit for release verification.
        required: false
        type: string
        default: ""
      run_process_tests:
        description: Include release process and STDIO tests.
        required: false
        type: boolean
        default: false
      concurrency_group:
        description: Concurrency group override for callers.
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - LICENSE
  pull_request:
    paths-ignore:
      - README.md
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ inputs.concurrency_group || format('ci-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  release-script-tests:
    name: Release Script Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Test release preparation and publication
        run: python3 -m unittest discover -s scripts/tests -v

  package-build:
    name: Package Build (macOS)
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Select latest Xcode
        id: toolchain
        run: |
          set -euo pipefail
          xcode_path="$(
            ruby -e 'candidates = Dir["/Applications/Xcode*.app"].filter_map { |path| version = File.basename(path)[/\AXcode[_-](\d+(?:\.\d+)*)\.app\z/, 1]; version ? [version.split(".").map(&:to_i), path] : nil }; abort "No versioned Xcode apps found" if candidates.empty?; puts candidates.max_by(&:first).last'
          )"
          sudo xcode-select -s "${xcode_path}/Contents/Developer"
          xcodebuild -version
          swift --version
          cache_id="$(xcodebuild -version | tr '\n ' '--' | tr -cd '[:alnum:]._-')"
          echo "cache-id=${cache_id}" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-build-v2-debug-strict-minimal-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-id }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ inputs.source_sha || github.sha }}
          restore-keys: |
            spm-build-v2-debug-strict-minimal-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-id }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      - name: Restore source modification times
        run: ./scripts/restore-source-mtimes.sh

      - name: Verify proxy target boundaries
        run: ./scripts/verify-proxy-target-boundaries.sh

      - name: Build package tests
        run: swift build --build-tests -Xswiftc -strict-concurrency=minimal

  package-tests:
    name: Package Tests (macOS, ${{ matrix.shard }})
    needs: package-build
    runs-on: macos-26
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard:
          - RuntimeCoordinatorInitializationTests
          - RuntimeCoordinatorRecoveryTests
          - RuntimeCoordinatorCatalogTests
          - RuntimeCoordinatorSchedulingTests
          - remaining
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Select latest Xcode
        id: toolchain
        run: |
          set -euo pipefail
          xcode_path="$(
            ruby -e 'candidates = Dir["/Applications/Xcode*.app"].filter_map { |path| version = File.basename(path)[/\AXcode[_-](\d+(?:\.\d+)*)\.app\z/, 1]; version ? [version.split(".").map(&:to_i), path] : nil }; abort "No versioned Xcode apps found" if candidates.empty?; puts candidates.max_by(&:first).last'
          )"
          sudo xcode-select -s "${xcode_path}/Contents/Developer"
          xcodebuild -version
          swift --version
          cache_id="$(xcodebuild -version | tr '\n ' '--' | tr -cd '[:alnum:]._-')"
          echo "cache-id=${cache_id}" >> "$GITHUB_OUTPUT"

      - name: Restore built package tests
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-build-v2-debug-strict-minimal-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-id }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ inputs.source_sha || github.sha }}
          fail-on-cache-miss: true

      - name: Run package tests
        run: |
          case "${{ matrix.shard }}" in
            remaining)
              ./scripts/ci-test-watchdog.sh swift test \
                --skip-build \
                --no-parallel \
                --filter XcodeMCPProxyRuntimeTests \
                --skip 'RuntimeCoordinatorInitializationTests|RuntimeCoordinatorRecoveryTests|RuntimeCoordinatorCatalogTests|RuntimeCoordinatorSchedulingTests' \
                -Xswiftc -strict-concurrency=minimal
              ./scripts/ci-test-watchdog.sh swift test \
                --skip-build \
                --no-parallel \
                --skip XcodeMCPProxyRuntimeTests \
                -Xswiftc -strict-concurrency=minimal
              exit 0
              ;;
            *)
              filter='${{ matrix.shard }}'
              ;;
          esac
          ./scripts/ci-test-watchdog.sh swift test \
            --skip-build \
            --no-parallel \
            --filter "${filter}" \
            -Xswiftc -strict-concurrency=minimal

  process-tests:
    name: Process Tests (macOS, ${{ matrix.suite }})
    needs: package-build
    if: inputs.run_process_tests
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite:
          - XcodeMCPProcessRuntimeTests
          - ProxyStdioAdapterTests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Select latest Xcode
        id: toolchain
        run: |
          set -euo pipefail
          xcode_path="$(
            ruby -e 'candidates = Dir["/Applications/Xcode*.app"].filter_map { |path| version = File.basename(path)[/\AXcode[_-](\d+(?:\.\d+)*)\.app\z/, 1]; version ? [version.split(".").map(&:to_i), path] : nil }; abort "No versioned Xcode apps found" if candidates.empty?; puts candidates.max_by(&:first).last'
          )"
          sudo xcode-select -s "${xcode_path}/Contents/Developer"
          xcodebuild -version
          swift --version
          cache_id="$(xcodebuild -version | tr '\n ' '--' | tr -cd '[:alnum:]._-')"
          echo "cache-id=${cache_id}" >> "$GITHUB_OUTPUT"

      - name: Restore built package tests
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-build-v2-debug-strict-minimal-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-id }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ inputs.source_sha || github.sha }}
          fail-on-cache-miss: true

      - name: Run process tests
        env:
          XCODE_MCP_RUN_PROCESS_TESTS: "1"
        run: |
          ./scripts/ci-test-watchdog.sh swift test \
            --skip-build \
            --no-parallel \
            --filter "${{ matrix.suite }}" \
            -Xswiftc -strict-concurrency=minimal


  checks:
    name: Package Checks
    needs: [release-script-tests, package-tests, process-tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful package and requested process tests
        env:
          SCRIPT_RESULT: ${{ needs.release-script-tests.result }}
          PACKAGE_RESULT: ${{ needs.package-tests.result }}
          PROCESS_RESULT: ${{ needs.process-tests.result }}
          PROCESS_REQUIRED: ${{ inputs.run_process_tests }}
        run: |
          test "$SCRIPT_RESULT" = success
          test "$PACKAGE_RESULT" = success
          if [[ "$PROCESS_REQUIRED" == true ]]; then
            test "$PROCESS_RESULT" = success
          fi
