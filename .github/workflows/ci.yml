name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - LICENSE
  pull_request:
    paths-ignore:
      - README.md
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: Package Tests (macOS)
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          xcode_path="$(
            ruby -e 'candidates = Dir["/Applications/Xcode*.app"].filter_map { |path| version = File.basename(path)[/\AXcode[_-](\d+(?:\.\d+)*)\.app\z/, 1]; version ? [version.split(".").map(&:to_i), path] : nil }; abort "No versioned Xcode apps found" if candidates.empty?; puts candidates.max_by(&:first).last'
          )"
          sudo xcode-select -s "${xcode_path}/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Run package tests
        run: |
          # Bound each Swift Testing process below the runner's observed stall threshold.
          for suite in \
            RuntimeCoordinatorProcessRoutingTests \
            RuntimeCoordinatorInitializationTests \
            RuntimeCoordinatorRecoveryTests \
            RuntimeCoordinatorCatalogTests \
            RuntimeCoordinatorWindowCatalogTests \
            RuntimeCoordinatorWindowRoutingTests \
            RuntimeCoordinatorSchedulingTests
          do
            ./scripts/ci-test-watchdog.sh swift test \
              --no-parallel \
              --filter "${suite}" \
              -Xswiftc -strict-concurrency=minimal
          done
          ./scripts/ci-test-watchdog.sh swift test \
            --no-parallel \
            --filter 'ControlPlaneAuthorityTests|JSONRPCResponseRouterTests|ManagedUpstreamSlotTests|ProxyUpstreamRequestRuntimeTests|ToolCatalogStartupLogFormatterTests|UpstreamReadinessTests' \
            -Xswiftc -strict-concurrency=minimal
          ./scripts/ci-test-watchdog.sh swift test \
            --no-parallel \
            --skip ProxyRuntimeCoordinatorTests \
            -Xswiftc -strict-concurrency=minimal

      - name: Run process tests
        run: |
          XCODE_MCP_RUN_PROCESS_TESTS=1 ./scripts/ci-test-watchdog.sh swift test \
            --no-parallel \
            --filter XcodeMCPProcessRuntimeTests \
            -Xswiftc -strict-concurrency=minimal
          XCODE_MCP_RUN_PROCESS_TESTS=1 ./scripts/ci-test-watchdog.sh swift test \
            --no-parallel \
            --filter ProxyStdioAdapterTests \
            -Xswiftc -strict-concurrency=minimal
