name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - README.ja.md
      - LICENSE
  pull_request:
    paths-ignore:
      - README.md
      - README.ja.md
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: Package Tests (macOS)
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          xcode_path="$(
            ruby -e 'paths = Dir["/Applications/Xcode_*.app"]; abort "No versioned Xcode apps found" if paths.empty?; puts paths.max_by { |path| path[/Xcode_(\d+(?:\.\d+)*)\.app\z/, 1].split(".").map(&:to_i) }'
          )"
          sudo xcode-select -s "${xcode_path}/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Run package tests
        run: |
          swift test \
            --no-parallel \
            -Xswiftc -strict-concurrency=minimal

      - name: Run process tests
        run: |
          XCODE_MCP_RUN_PROCESS_TESTS=1 swift test \
            --no-parallel \
            --filter ProxyProcessTests \
            -Xswiftc -strict-concurrency=minimal
